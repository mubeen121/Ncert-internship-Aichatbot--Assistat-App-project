name: ember_ai
description: "Ember AI — a distinctive AI Chatbot Assistant built with Flutter, in a Red & Black theme, with voice input, chat history sidebar, and a splash screen."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  http: ^1.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
